<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B101B"/>
    </linearGradient>
    <linearGradient id="cyanPawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="redPawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6384"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="wallCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="wallRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4B6E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Base tile shield -->
  <rect x="16" y="16" width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  
  <!-- Subtle grid lattice lines -->
  <line x1="36" y1="80" x2="124" y2="80" stroke="#1E293B" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="80" y1="36" x2="80" y2="124" stroke="#1E293B" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Strategic Fortress Walls (Crossed Interlocking Barrier Motif) -->
  <rect x="42" y="52" width="76" height="10" rx="5" fill="url(#wallCyan)" filter="url(#glowCyan)"/>
  <rect x="75" y="60" width="10" height="52" rx="5" fill="url(#wallRed)"/>
  
  <!-- Player 1 Stylized Pawn Top-Left -->
  <circle cx="56" cy="100" r="14" fill="url(#cyanPawn)"/>
  <circle cx="53" cy="97" r="5" fill="#BAE6FD" opacity="0.8"/>
  
  <!-- Player 2 Stylized Pawn Bottom-Right -->
  <circle cx="104" cy="42" r="14" fill="url(#redPawn)"/>
  <circle cx="101" cy="39" r="5" fill="#FECDD3" opacity="0.8"/>
</svg>
